name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  lint-and-compile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install ruff
        run: pip install ruff

      - name: Lint bootstrap kit (assets/project)
        working-directory: assets/project
        run: |
          ruff check .
          ruff format --check .

      - name: Lint standalone scripts
        run: ruff check scripts

      - name: Byte-compile every Python file (catches syntax errors)
        run: python -m compileall -q assets/project scripts
